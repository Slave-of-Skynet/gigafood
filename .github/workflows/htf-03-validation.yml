name: Validate HTF-03 evidence

on:
  pull_request:
    paths:
      - 'docs/evidence/htf-03/**'
      - 'scripts/validate_htf03.py'
      - '.github/workflows/htf-03-validation.yml'

permissions:
  contents: read

jobs:
  validate-htf03:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_htf03.py --self-test
